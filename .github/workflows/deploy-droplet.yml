name: Deploy to Droplet

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: laundry-locker-microservices-droplet
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test services
        run: mvn -B clean verify

      - name: Package deploy artifact
        run: |
          tar \
            --exclude='./.git' \
            --exclude='./laundry-ms.zip' \
            -czf /tmp/laundry-locker-microservices.tar.gz .
          sha256sum /tmp/laundry-locker-microservices.tar.gz \
            > /tmp/laundry-locker-microservices.tar.gz.sha256

      - name: Upload deploy artifact checksum
        uses: actions/upload-artifact@v4
        with:
          name: laundry-locker-microservices-deploy-checksum
          path: /tmp/laundry-locker-microservices.tar.gz.sha256
          retention-days: 14

      - name: Attest deploy artifact provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            /tmp/laundry-locker-microservices.tar.gz
            /tmp/laundry-locker-microservices.tar.gz.sha256

      - name: Configure SSH
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          test -n "$DROPLET_HOST"
          test -n "$DROPLET_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DROPLET_HOST" >> ~/.ssh/known_hosts

      - name: Upload artifact
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_PORT: ${{ secrets.DROPLET_PORT }}
        run: |
          test -n "$DROPLET_HOST"
          test -n "$DROPLET_USER"
          PORT="${DROPLET_PORT:-22}"
          scp -P "$PORT" -i ~/.ssh/deploy_key \
            /tmp/laundry-locker-microservices.tar.gz \
            /tmp/laundry-locker-microservices.tar.gz.sha256 \
            "$DROPLET_USER@$DROPLET_HOST:/tmp/"

      - name: Deploy on Droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_PORT: ${{ secrets.DROPLET_PORT }}
        run: |
          PORT="${DROPLET_PORT:-22}"
          ssh -p "$PORT" -i ~/.ssh/deploy_key "$DROPLET_USER@$DROPLET_HOST" \
            'bash -s' < scripts/deploy-from-artifact.sh
