services:
  postgres:
    image: postgres:16-alpine
    container_name: ll-ms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - laundry-ms-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ll-ms-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 20s
      retries: 20
      start_period: 60s
    networks:
      - laundry-ms-network

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: ll-ms-discovery-server
    restart: unless-stopped
    environment:
      SERVER_PORT: 8761
      JAVA_OPTS: "-Xms64m -Xmx256m -XX:+UseContainerSupport"
    ports:
      - "127.0.0.1:8761:8761"
    networks:
      - laundry-ms-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ll-ms-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      APP_SECURITY_JWT_SECRET: laundry-locker-microservices-secret-key-change-me-please-32chars
      JAVA_OPTS: "-Xms64m -Xmx320m -XX:+UseContainerSupport"
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server
    networks:
      - laundry-ms-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: ll-ms-auth-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_pass
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      SPRING_MAIL_HOST: localhost
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: noreply@laundry.test
      SPRING_MAIL_PASSWORD: ""
      MANAGEMENT_HEALTH_MAIL_ENABLED: false
      SPRING_RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      APP_SECURITY_JWT_SECRET: laundry-locker-microservices-secret-key-change-me-please-32chars
      JAVA_OPTS: "-Xms64m -Xmx256m -XX:+UseContainerSupport"
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - laundry-ms-network

  user-service:
