server:
  port: ${SERVER_PORT:8090}
spring:
  application:
    name: staff-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/staff_db}
    username: ${SPRING_DATASOURCE_USERNAME:staff_user}
    password: ${SPRING_DATASOURCE_PASSWORD:staff_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: staff_schema
  flyway:
    enabled: true
    create-schemas: true
    schemas: staff_schema
    default-schema: staff_schema
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}

logging:
  pattern:
    level: "%5p [${spring.application.name:unknown},%X{correlationId:-}]"
